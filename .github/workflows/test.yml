name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --check app.js && node --check pbr.js && node --check tile.js && node --check tile-editor.js && node --check export.js && node --check sw.js && node --check version.js
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
